name: Publish Obsidian release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: algoforge-obsidian-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use numeric SemVer without a prefix."
            exit 1
          fi
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test -s main.js
          test -s manifest.json
          test -s styles.css
          test -s versions.json
          test "$(jq -r --arg version "$VERSION" '.[$version]' versions.json)" = "$(jq -r .minAppVersion manifest.json)"

      - name: Verify canonical build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "$asset" -R Bing-Chill-inc/Algoforge-main
          done

      - name: Attest mirrored release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$VERSION" --dir "$existing" \
              --pattern main.js \
              --pattern manifest.json \
              --pattern styles.css
            cmp main.js "$existing/main.js"
            cmp manifest.json "$existing/manifest.json"
            cmp styles.css "$existing/styles.css"
            echo "Release $VERSION already exists with matching required assets."
          else
            gh release create "$VERSION" main.js manifest.json styles.css \
              --title "$VERSION" \
              --notes "Automated AlgoForge Obsidian release $VERSION."
          fi

      - name: Publish release metadata to main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git merge-base --is-ancestor origin/main "$RELEASE_SHA" || {
              echo "::error::Release commit is not a fast-forward of destination main."
              exit 1
            }
          fi
          git push origin "$RELEASE_SHA:refs/heads/main"
