name: Run tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install editor dependencies
              working-directory: src/front-editeur
              run: bun install --frozen-lockfile

            - name: Install Chromium
              working-directory: src/front-editeur
              run: bunx playwright install --with-deps chromium

            - name: Check editor
              working-directory: src/front-editeur
              run: bun run check

            - name: Test editor runtime injection
              working-directory: src/back
              run: bun test tests/editorRuntimeConfig.test.ts

            - name: Install backend dependencies
              working-directory: src/back
              run: bun install --frozen-lockfile

            - name: Run backend tests
              working-directory: src/back
              run: bun test --env-file=../../template-test.env ./tests/setup.test.ts
