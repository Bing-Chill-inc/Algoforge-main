name: Run tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: true

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install editor dependencies
              working-directory: src/front-editeur
              run: bun install --frozen-lockfile

            - name: Install Chromium
              working-directory: src/front-editeur
              run: bunx playwright install --with-deps chromium

            - name: Check editor
              working-directory: src/front-editeur
              run: bun run check

            - name: Install VS Code extension dependencies
              working-directory: src/vscode-ext
              run: bun install --frozen-lockfile

            - name: Check VS Code extension
              working-directory: src/vscode-ext
              run: bun run check

            - name: Test VS Code extension host
              working-directory: src/vscode-ext
              run: xvfb-run -a bun run test:integration

            - name: Package VS Code extension
              working-directory: src/vscode-ext
              run: bun run package && bun run package:list

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: algoforge-vscode
                  path: src/vscode-ext/out/*.vsix
                  if-no-files-found: error

            - name: Test editor runtime injection
              working-directory: src/back
              run: bun test tests/editorRuntimeConfig.test.ts

            - name: Install backend dependencies
              working-directory: src/back
              run: bun install --frozen-lockfile

            - name: Run backend tests
              working-directory: src/back
              run: bun test --env-file=../../template-test.env ./tests/setup.test.ts
