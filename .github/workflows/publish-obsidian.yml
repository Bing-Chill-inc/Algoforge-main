name: Publish AlgoForge Obsidian

on:
  push:
    tags:
      - "obsidian-v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: algoforge-obsidian-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: obsidian-release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source tag
        id: version
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Obsidian releases must point to a commit on main."
            exit 1
          }
          version="${GITHUB_REF_NAME#obsidian-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use an obsidian-vX.Y.Z source tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install plugin dependencies
        working-directory: src/obsidian-plugin
        run: bun install --frozen-lockfile

      - name: Check plugin
        working-directory: src/obsidian-plugin
        run: bun run check

      - name: Stage release mirror
        working-directory: src/obsidian-plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run release:stage --version "$VERSION" --output "$RUNNER_TEMP/algoforge-obsidian-release"

      - name: Attest the built plugin assets
        uses: actions/attest@v4
        with:
          subject-path: |
            src/obsidian-plugin/dist/main.js
            src/obsidian-plugin/dist/manifest.json
            src/obsidian-plugin/dist/styles.css

      - name: Configure destination deploy key
        env:
          OBSIDIAN_DEPLOY_KEY: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OBSIDIAN_DEPLOY_KEY:-}" ]]; then
            echo "::error::Missing OBSIDIAN_DEPLOY_KEY secret."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/obsidian-ssh"
          printf '%s\n' "$OBSIDIAN_DEPLOY_KEY" > "$RUNNER_TEMP/obsidian-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/obsidian-ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com 2>/dev/null > "$RUNNER_TEMP/obsidian-ssh/known_hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/obsidian-ssh/known_hosts" -E sha256 | awk '{ print $2 }')"
          expected="SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
          if [[ "$fingerprint" != "$expected" ]]; then
            echo "::error::Unexpected GitHub SSH host key fingerprint: $fingerprint"
            exit 1
          fi

      - name: Publish immutable destination tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_SSH_COMMAND: >-
            ssh -i ${{ runner.temp }}/obsidian-ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile=${{ runner.temp }}/obsidian-ssh/known_hosts
        run: |
          set -euo pipefail
          src/obsidian-plugin/scripts/publish-tag.sh \
            "$RUNNER_TEMP/algoforge-obsidian-release" \
            git@github.com:Bing-Chill-inc/algoforge-obsidian.git \
            "$VERSION" \
            "$RUNNER_TEMP/algoforge-obsidian-publish"

      - name: Verify the destination release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/obsidian-release.json"
          for attempt in {1..60}; do
            if curl -fsSL "https://api.github.com/repos/Bing-Chill-inc/algoforge-obsidian/releases/tags/$VERSION" \
              -o "$release_json" 2>/dev/null; then
              break
            fi
            echo "Waiting for destination release $VERSION (attempt $attempt)."
            sleep 10
          done
          test -s "$release_json"
          test "$(jq -r .tag_name "$release_json")" = "$VERSION"
          expected="$(printf '%s\n' main.js manifest.json styles.css)"
          actual="$(jq -r '.assets[].name' "$release_json" | sort)"
          test "$actual" = "$expected"
          for asset in main.js manifest.json styles.css; do
            url="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")"
            curl -fsSL "$url" -o "$RUNNER_TEMP/$asset"
            cmp "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/algoforge-obsidian-release/$asset"
          done

      - name: Advance destination main after release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_SSH_COMMAND: >-
            ssh -i ${{ runner.temp }}/obsidian-ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile=${{ runner.temp }}/obsidian-ssh/known_hosts
        run: |
          src/obsidian-plugin/scripts/advance-main.sh \
            "$RUNNER_TEMP/algoforge-obsidian-publish/mirror" "$VERSION"
